[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ei-organism"
version = "0.1.0"
description = "A frozen rule that learns from its own prediction error and carries a corrected seed between runs; finds hidden links between threads in any database."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
test = ["pytest>=8"]

[project.scripts]
organism = "organism.cli:main"

[tool.setuptools]
packages = ["organism"]
